<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Popup GUI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        .chat-box {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            background: rgba(20,20,20,0.95);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        .popup-response {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 20px 35px;
            border-radius: 14px;
            font-size: 22px;
            text-align: center;
            display: none;
            max-width: 70%;
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="popup-response" id="popup"></div>

<div class="chat-box">
    <input
        id="userInput"
        type="text"
        placeholder="Type something and press Enter..."
    />
</div>

<script>
const input = document.getElementById("userInput");
const popup = document.getElementById("popup");

/*
IMPORTANT:
Replace this with your own OpenAI API key.
Never expose real API keys publicly in production.
*/
const API_KEY = "YOUR_OPENAI_API_KEY_HERE";

async function askChatGPT(message) {
    try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [
                    {
                        role: "user",
                        content: message
                    }
                ]
            })
        });

        const data = await response.json();

        if (!data.choices || !data.choices.length) {
            showPopup("No response received.");
            return;
        }

        const reply = data.choices[0].message.content;
        showPopup(reply);

    } catch (error) {
        console.error(error);
        showPopup("Error connecting to ChatGPT.");
    }
}

function showPopup(text) {
    popup.innerText = text;
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 4000);
}

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        const message = input.value.trim();

        if (!message) return;

        askChatGPT(message);
        input.value = "";
    }
});
</script>

</body>
</html>
