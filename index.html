<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Popup App</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: transparent;
        overflow: hidden;
    }

    .chat-box {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 420px;
        background: rgba(20,20,20,0.95);
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    input {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        outline: none;
        font-size: 16px;
        box-sizing: border-box;
    }

    .popup-response {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.88);
        color: white;
        padding: 22px 35px;
        border-radius: 14px;
        font-size: 22px;
        text-align: center;
        display: none;
        max-width: 75%;
        z-index: 9999;
        word-wrap: break-word;
    }
</style>
</head>
<body>

<div class="popup-response" id="popup"></div>

<div class="chat-box">
    <input
        id="userInput"
        type="text"
        placeholder="Type message and press Enter..."
    />
</div>

<script>
const input = document.getElementById("userInput");
const popup = document.getElementById("popup");

/*
PUT YOUR REAL OPENAI API KEY HERE

Example:
const API_KEY = "sk-xxxxxxxxxxxxxxxxxxxx";
*/

const API_KEY = "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";

async function askChatGPT(message) {
    try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: "gpt-3.5-turbo",
                messages: [
                    {
                        role: "user",
                        content: message
                    }
                ],
                temperature: 0.7
            })
        });

        const data = await response.json();

        console.log("API RESPONSE:", data);

        if (!response.ok) {
            showPopup(data.error?.message || "API request failed");
            return;
        }

        if (!data.choices || !data.choices.length) {
            showPopup("No response received");
            return;
        }

        const reply = data.choices[0].message.content;
        showPopup(reply);

    } catch (error) {
        console.error("FULL ERROR:", error);
        showPopup("Error: " + error.message);
    }
}

function showPopup(text) {
    popup.innerText = text;
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 4000);
}

input.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        const message = input.value.trim();

        if (!message) return;

        askChatGPT(message);
        input.value = "";
    }
});
</script>

</body>
</html>
